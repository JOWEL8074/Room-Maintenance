
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report a Problem</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <h2>Room Maintenance</h2>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="Report.html">Report</a>
            <a href="Services.html">Services</a>
            <a href="Contact.html">Contact</a>
            <button onclick="logout()">Logout</button>
        </div>
    </nav>

    <section class="form-container">
        <h1>Report a Maintenance Problem</h1>
        <p>Fill in the details to submit your complaint.</p>

        <form id="reportForm">

            <label>Student Name</label>
            <input type="text" id="studentName" required>

            <label>Room Number</label>
            <input type="text" id="roomNumber"
                   placeholder="Enter room number" required>

            <label>Problem Category</label>
            <select id="category" required>
                <option value="">Select a problem</option>
                <option value="Electrical">Electrical</option>
                <option value="Plumbing">Plumbing</option>
                <option value="Furniture">Furniture</option>
                <option value="Cleaning">Cleaning</option>
                <option value="Internet">Internet</option>
                <option value="Other">Other</option>
            </select>

            <label>Problem Description</label>
            <textarea id="description"
                      placeholder="Explain your problem..."
                      required></textarea>

            <button type="submit">Submit Report</button>
        </form>

        <p id="reportMessage"></p>
    </section>

    <section class="report-list">
        <h2>My Submitted Reports</h2>
        <div id="reportsList"></div>
    </section>

    <footer>
        <p>© 2026 Room Maintenance Management System</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
